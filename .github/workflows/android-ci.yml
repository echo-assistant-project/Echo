name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android build and available tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager is missing from the hosted runner." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check Kokoro service Python syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for source in Path("tools/KokoroVoice").glob("*.py"):
              compile(source.read_text(encoding="utf-8"), str(source), "exec")
          PY
      - name: Run Android unit-test task and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
