plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.echo.assistant'
    compileSdk 36
    defaultConfig { applicationId 'com.echo.assistant'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.2.0' }
    buildFeatures { compose true }
}
dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.08.00')
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.mediapipe:tasks-genai:0.10.14'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
def echoBuildDir = System.getenv('ECHO_BUILD_DIR')
if (echoBuildDir) layout.buildDirectory.set(file(echoBuildDir))


